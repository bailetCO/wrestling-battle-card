# Publie le jeu sur GitHub Pages à chaque modification de la branche main.
# Pour une demande de fusion (pull request) vers main : vérifie seulement (types, tests,
# construction), sans rien publier. La coche verte dit qu'on peut fusionner sans risque.
# Adresse : https://bailetco.github.io/wrestling-battle-card/
name: Publier le jeu

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une vérification de demande de fusion n'annule jamais une publication en cours.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('verif-{0}', github.ref) || 'pages' }}
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vérification des types
        run: npm run verifier-types
      - name: Tests
        run: npm test
      - name: Construction du jeu
        run: npm run build
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publier:
    needs: construire
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      - id: publication
        uses: actions/deploy-pages@v4
