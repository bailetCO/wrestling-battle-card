    <section class="regle">

      <ul class="liste-regles">

        <li><b>Style de combat</b> (entraînement et entre amis) : le <b>format</b> (Normal ou Enchaînement) et la <b>durée</b> (normale, ou <b>infinie</b> : pas de périodes ni d'écart, le combat ne s'arrête que sur un tombé ou un abandon). En durée infinie, la fatigue monte : dès le tour ${$.infini.debutFatigue}, on récupère tous les 3 tours, puis tous les 4 tours au tour ${$.infini.debutFatigue+$.infini.palier}, etc. ; dès le tour ${$.infini.debutSurcout}, chaque action coûte +1, puis +1 de plus tous les ${$.infini.palier} tours. Ne plus pouvoir payer aucune action pendant ${$.toursSansEnduranceAvantTombe} tours, c'est le tombé.</li>
